<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f1ec">
  <meta name="description" content="Ranbir Kumar — connect on Instagram and YouTube.">
  <title>Ranbir Kumar</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: #f4f1ec;
      color: #242424;
      font-family: Arial, Helvetica, sans-serif;
    }
    .profile {
      width: min(100%, 390px);
      text-align: center;
      padding: 34px 26px 30px;
      background: #fff;
      border: 1px solid #e9e5df;
      border-radius: 24px;
      box-shadow: 0 18px 55px rgba(37, 32, 25, .08);
    }
    .avatar {
      width: 142px;
      height: 142px;
      margin: 0 auto 22px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #d9e5e2, #b8c9c4 55%, #8fa8a2);
      border: 5px solid #fff;
      box-shadow: 0 5px 22px rgba(0,0,0,.12);
    }
    .avatar svg { width: 100%; height: 100%; display: block; }
    h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.7px;
    }
    .subtitle {
      margin: 9px 0 25px;
      color: #858585;
      font-size: 14px;
      letter-spacing: .2px;
    }
    .links-box {
      padding: 17px;
      border-radius: 17px;
      background: #f7f6f3;
      border: 1px solid #eeece7;
    }
    .links-title {
      margin: 0 0 13px;
      color: #77736d;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }
    .social-link {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 52px;
      padding: 10px 13px;
      color: #282828;
      background: #fff;
      border: 1px solid #ece9e3;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .social-link + .social-link { margin-top: 10px; }
    .social-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(0,0,0,.07);
    }
    .icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      flex: 0 0 30px;
    }
    .instagram { background: linear-gradient(135deg, #7353c6, #d94c82, #f3a34b); }
    .youtube { background: #e62117; }
    .icon svg { width: 18px; height: 18px; fill: currentColor; }
    .arrow { margin-left: auto; color: #a6a29b; font-size: 20px; font-weight: 400; }
    .footer {
      margin: 22px 0 0;
      color: #aaa59d;
      font-size: 11px;
      letter-spacing: .4px;
    }
  </style>
</head>
<body>
  <main class="profile">
    <div class="avatar" role="img" aria-label="Temporary profile image placeholder">
      <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="80" cy="58" r="29" fill="#f3eee7"/>
        <path d="M25 151c4-34 25-53 55-53s51 19 55 53" fill="#f3eee7"/>
        <path d="M53 58c0-17 11-31 27-31 17 0 28 14 28 31-8-8-17-12-28-12-10 0-19 4-27 12z" fill="#667d77"/>
      </svg>
    </div>

    <h1>Ranbir Kumar</h1>
    <p class="subtitle">Connect with me</p>

    <section class="links-box" aria-label="Social media links">
      <p class="links-title">Find me on</p>
      <a class="social-link" href="https://www.instagram.com/ranbirk_1?bqrl=dHhlOW41b3UyY3Ry" target="_blank" rel="noopener noreferrer">
        <span class="icon instagram" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2zm0 2A3.8 3.8 0 0 0 4 7.8v8.4A3.8 3.8 0 0 0 7.8 20h8.4a3.8 3.8 0 0 0 3.8-3.8V7.8A3.8 3.8 0 0 0 16.2 4H7.8zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.2-3.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg>
        </span>
        Instagram
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="social-link" href="https://youtube.com/@ranbir_tech" target="_blank" rel="noopener noreferrer">
        <span class="icon youtube" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg>
        </span>
        YouTube
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </section>
    <p class="footer">© <span id="year"></span> Ranbir Kumar</p>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
