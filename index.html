<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12143a">
<meta name="description" content="Ranbir Kumar — connect on Instagram and YouTube.">
<title>Ranbir Kumar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12143a; --bg2:#1d1b5a; --ink:#f6f4ff; --muted:#aeb0d6;
    --gold:#ffb547; --pink:#ff5e9c; --violet:#7a5cff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    padding:28px 18px; color:var(--ink); overflow-x:hidden;
    font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2) 55%,#2a1a63);
    position:relative;
  }
  /* slow drifting colour glows */
  .glow{position:fixed; border-radius:50%; filter:blur(70px); opacity:.45; pointer-events:none; z-index:0}
  .g1{width:300px;height:300px;background:var(--violet);top:-80px;left:-90px;animation:drift 14s ease-in-out infinite alternate}
  .g2{width:260px;height:260px;background:var(--pink);bottom:-70px;right:-80px;animation:drift 17s ease-in-out infinite alternate-reverse}
  .g3{width:180px;height:180px;background:var(--gold);top:45%;right:-60px;opacity:.28;animation:drift 20s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(40px,50px) scale(1.15)}}

  .card{
    position:relative; z-index:1; width:min(100%,390px); text-align:center;
    padding:38px 24px 28px; border-radius:30px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 30px 80px rgba(5,5,30,.55);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

  /* full photo with flowing gradient border */
  .photo{
    position:relative; width:230px; aspect-ratio:1079/1458; margin:0 auto 24px;
    padding:5px; border-radius:30px;
    background:linear-gradient(120deg,var(--gold),var(--pink),var(--violet),var(--gold));
    background-size:300% 100%; animation:flow 5s linear infinite;
  }
  .photo::after{ /* soft pulse */
    content:""; position:absolute; inset:0; border-radius:30px;
    box-shadow:0 0 0 0 rgba(255,94,156,.45); animation:pulse 2.8s ease-out infinite;
  }
  .photo img{
    width:100%; height:100%; object-fit:cover; display:block; border-radius:25px;
  }
  @keyframes flow{to{background-position:-300% 0}}
  @keyframes pulse{to{box-shadow:0 0 0 22px rgba(255,94,156,0)}}

  h1{margin:0; font-size:29px; line-height:1.2; font-weight:700; letter-spacing:-.5px}
  .subtitle{margin:8px 0 26px; color:var(--muted); font-size:14px}

  .links{display:grid; gap:12px}
  .link{
    position:relative; overflow:hidden; display:flex; align-items:center; gap:14px;
    min-height:56px; padding:10px 14px; color:#fff; text-decoration:none;
    font-size:15.5px; font-weight:600; border-radius:16px;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.08);
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
    opacity:0; animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .link:nth-child(1){animation-delay:.45s}
  .link:nth-child(2){animation-delay:.6s}
  .link::before{ /* shimmer sweep */
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
    transform:skewX(-20deg); transition:left .6s ease;
  }
  .link:hover::before,.link:focus-visible::before{left:130%}
  .link:hover,.link:focus-visible{transform:translateY(-3px) scale(1.02); background:rgba(255,255,255,.14)}
  .link:active{transform:scale(.97)}
  .link:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
  .ig:hover,.ig:focus-visible{box-shadow:0 12px 28px rgba(217,76,130,.4)}
  .yt:hover,.yt:focus-visible{box-shadow:0 12px 28px rgba(230,33,23,.4)}
  .icon{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:11px}
  .icon svg{width:20px;height:20px;fill:#fff}
  .ig .icon{background:linear-gradient(135deg,#7353c6,#d94c82,#f3a34b)}
  .yt .icon{background:#e62117}
  .arrow{margin-left:auto; font-size:22px; color:var(--muted); transition:transform .2s ease}
  .link:hover .arrow{transform:translateX(5px); color:#fff}
  .footer{margin:24px 0 0; color:#8a8cb8; font-size:12px}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
    .link{opacity:1}
  }
</style>
</head>
